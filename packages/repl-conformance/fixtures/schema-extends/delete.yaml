name: deleting against a base schema also matches (and deletes) instances of an extending schema

seed:
  schemas:
    - name: base_item
      is_root: null
      properties:
        - name: label
          type: string
    - name: special_item
      is_root: null
      extends: base_item
      properties: []

commands:
  - run: |
      kind: create
      schema: base_item
      input: [{label: "b1"}]

  - run: |
      kind: create
      schema: special_item
      input: [{label: "s1"}]

  # A base schema reference matches instances of schemas extending it too —
  # see document_part-definition-schema.md's `extends` and
  # document_part-definition-command.md's Processing step 4. The filter
  # only matches the special_item instance, so this should delete it even
  # though the command's schema is base_item.
  - as: deleted
    run: |
      kind: delete
      schema: base_item
      filters:
        label: s1

  - as: remaining
    run: |
      kind: query
      schema: special_item

expect:
  - path: deleted.after
    length: 0
  - path: deleted.before
    length: 1
  - path: remaining.after
    length: 0
