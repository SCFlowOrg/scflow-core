name: setting a relation typed to a base schema accepts an instance of a schema extending it

seed:
  schemas:
    - name: team
      is_root: null
      name_scope: []
      properties:
        - name: name
          type: string
    - name: special_team
      is_root: null
      extends: team
      properties: []
    - name: person
      is_root: null
      name_scope: []
      properties:
        - name: name
          type: string
        - name: team
          type: team

commands:
  - run: |
      kind: create
      schema: special_team
      input: [{id: "0cc64073-3b67-4442-832b-eeb9bf0d7556", name: "st1"}]

  # st1 is a special_team, which extends team — the "team" relation on
  # person is declared `type: team`, so an instance of an extending schema
  # must be accepted too (see packages/core/docs/spec/meta-model.md#schema's `extends`).
  - as: created
    run: |
      kind: create
      schema: person
      input: [{id: "b78f5766-11ec-46f9-8af3-ca654c22172a", name: "p1", team: "0cc64073-3b67-4442-832b-eeb9bf0d7556"}]

  - run: |
      kind: create
      schema: team
      input: [{id: "e5353879-bd69-4fdd-8b46-5dad176ff52d", name: "t1"}]

  # Same on update, and against the exact base schema too, not just the
  # extending one.
  - as: updated
    run: |
      kind: update
      schema: person
      filters:
        name: p1
      input: [{team: "e5353879-bd69-4fdd-8b46-5dad176ff52d"}]

expect:
  - path: created.after.0.team
    equals: 0cc64073-3b67-4442-832b-eeb9bf0d7556
  - path: updated.after.0.team
    equals: e5353879-bd69-4fdd-8b46-5dad176ff52d
