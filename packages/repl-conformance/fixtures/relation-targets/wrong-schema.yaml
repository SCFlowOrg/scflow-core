name: setting a relation to an instance of a schema that isn't the declared type (or an extension of it) is rejected

seed:
  schemas:
    - name: dog
      is_root: null
      name_scope: []
      properties:
        - name: name
          type: string
    - name: team
      is_root: null
      name_scope: []
      properties:
        - name: name
          type: string
    - name: person
      is_root: null
      name_scope: []
      properties:
        - name: name
          type: string
        - name: team
          type: team

commands:
  - run: |
      kind: create
      schema: dog
      input: [{id: "6e6c26f0-ffbf-4a2d-82c4-5d548bcec0b9", name: "rex"}]

  - run: |
      kind: create
      schema: team
      input: [{id: "e5353879-bd69-4fdd-8b46-5dad176ff52d", name: "t1"}]

  # rex is a dog, not a team, and dog doesn't extend team — the "team"
  # relation on person is declared `type: team`, so this must be rejected.
  - run: |
      kind: create
      schema: person
      input: [{id: "b78f5766-11ec-46f9-8af3-ca654c22172a", name: "p1", team: "6e6c26f0-ffbf-4a2d-82c4-5d548bcec0b9"}]
    expectError: unknown_relation_target

  # A correctly-typed target still works — control for the check above.
  - as: created
    run: |
      kind: create
      schema: person
      input: [{id: "c5fd961c-9f73-4a95-8a30-8050062e7a2c", name: "p2", team: "e5353879-bd69-4fdd-8b46-5dad176ff52d"}]

  # Same check on update, not just create — computePropertyValue is shared
  # by both.
  - run: |
      kind: update
      schema: person
      filters:
        name: p2
      input: [{team: "6e6c26f0-ffbf-4a2d-82c4-5d548bcec0b9"}]
    expectError: unknown_relation_target

expect:
  - path: created.after.0.team
    equals: e5353879-bd69-4fdd-8b46-5dad176ff52d
