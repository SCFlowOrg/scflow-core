name: a query filters on a generated (virtual) relation property the same way it does on a declared one

# thing.box is the declared relation (owner + inverse_is_array +
# inverse_name: things); owner_box.things is the generated (virtual)
# inverse. This checks that filtering matches against its resolved value,
# not just that reading it back on an already-matched instance works (see
# one-to-one.yaml/one-to-many.yaml for the read/write side).

seed:
  schemas:
    # owner_box first — thing.box's type targets it, and a relation's
    # declaring schema must be created after its target exists.
    - name: owner_box
      is_root:
      name_scope: []
      properties:
        - name: name
          type: string
    - name: thing
      name_scope: []
      properties:
        - name: name
          type: string
        - name: box
          type: owner_box
          owner:
          inverse_name: things
          inverse_is_array:

commands:
  - run: |
      create: owner_box
      input: [{id: 7e83ca2a-65d6-490a-809c-8570c6c905a9, name: b1}, {id: 32f28ea0-3b1b-4012-8629-d2ca63fc6665, name: b2}]
  - run: |
      create: thing
      input: [{id: e5353879-bd69-4fdd-8b46-5dad176ff52d, name: t1, box: 7e83ca2a-65d6-490a-809c-8570c6c905a9}, {id: 2a5bd027-10e9-45a7-8bb9-2da876655950, name: t2, box: 32f28ea0-3b1b-4012-8629-d2ca63fc6665}, {id: 4358694e-eb09-4c67-88ae-914a10562ce7, name: t3, box: 7e83ca2a-65d6-490a-809c-8570c6c905a9}]
  - as: found
    run: |
      query: thing
      filters:
        box: 7e83ca2a-65d6-490a-809c-8570c6c905a9

expect:
  - path: found.after
    length: 2
