# SCFLOW schemas and scalar types, as authored by core-plugin.
# Source of truth: scflow_model, section 3 (THE SCHEMAS). This file follows it.
# Compiled to src/schemas.generated.ts by scripts/build-schemas.mjs.

scalar_types:
  - name: flow_domain
    extends: string
    enum: [physical, information, financial, service]

  - name: transformation_role
    extends: string
    enum: [consumed, produced]

  - name: tag
    extends: string

  - name: latitude
    extends: number
    minimum: -90
    maximum: 90

  - name: longitude
    extends: number
    minimum: -180
    maximum: 180

  - name: country_code
    extends: string
    pattern: ^([A-Z]{2})?$

  - name: un_locode
    extends: string
    pattern: ^([A-Z]{2}[A-Z2-9]{3})?$

schemas:
  - name: annotable
    description: The base schema of every entity that carries notes and tags
    is_root: true
    properties:
      - name: tags
        type: tag
        is_array: true
        is_unique: true

  - name: note
    description: A free-form annotation of one entity, written in one or more languages
    properties:
      - name: annotated
        type: annotable
        owner: true
        inverse_name: notes
        inverse_is_array: true
      - name: content
        type: localized_markdown
        min_length: 1

  - name: actor_type
    description: A type of actor, with the flow domains it belongs to
    extends: annotable
    is_root: true
    has_description: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: domains
        type: flow_domain
        is_set: true
        min_length: 1
      - name: default_scope
        type: scope

  - name: item_type
    description: A type of item, with the one flow domain it belongs to
    extends: annotable
    is_root: true
    has_description: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: domain
        type: flow_domain

  - name: actor
    description: A place in the network where items are held, consumed, produced or queued
    extends: annotable
    is_root: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: type
        type: actor_type
        mandatory: true
        inverse_name: actors
        inverse_is_array: true
      - name: scope
        type: scope
        inverse_name: actors
        inverse_is_array: true
      - name: location
        type: location
        inverse_name: actors
        inverse_is_array: true
      - name: parent_actor
        type: actor
        inverse_name: child_actors
        inverse_is_array: true

  - name: flow
    description: A connection moving one optional item from a source actor to a destination actor
    extends: annotable
    is_root: true
    properties:
      - name: display_name
        type: localized_string
      - name: description
        type: localized_markdown
      - name: source
        type: actor
        mandatory: true
        inverse_name: outgoing_flows
        inverse_is_array: true
      - name: destination
        type: actor
        mandatory: true
        inverse_name: incoming_flows
        inverse_is_array: true
      - name: item
        type: item
        inverse_name: carried_on
        inverse_is_array: true
      - name: bidirectional
        type: boolean

  - name: item
    description: A family of things the network moves and holds
    extends: annotable
    is_root: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: type
        type: item_type
        mandatory: true
        inverse_name: items
        inverse_is_array: true

  - name: item_at_actor
    description: An item held at an actor
    extends: annotable
    properties:
      - name: actor
        type: actor
        owner: true
        inverse_name: held_items
        inverse_is_array: true
      - name: item
        type: item
        mandatory: true
        constant: true
        inverse_name: held_at
        inverse_is_array: true

  - name: transformation_type
    description: A type of transformation
    extends: annotable
    is_root: true
    has_description: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown

  - name: transformation
    description: A transformation of consumed items into produced items at an actor
    extends: annotable
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: type
        type: transformation_type
        mandatory: true
        constant: true
        inverse_name: transformations
        inverse_is_array: true
      - name: actor
        type: actor
        owner: true
        inverse_name: transformations
        inverse_is_array: true

  - name: transformation_line
    description: One item consumed or produced by a transformation
    extends: annotable
    properties:
      - name: transformation
        type: transformation
        owner: true
        inverse_name: lines
        inverse_is_array: true
      - name: role
        type: transformation_role
      - name: held_item
        type: item_at_actor
        mandatory: true
        inverse_name: transformation_lines
        inverse_is_array: true

  - name: conversion
    description: A conversion of one item into another item at an actor
    extends: annotable
    properties:
      - name: display_name
        type: localized_string
      - name: description
        type: localized_markdown
      - name: actor
        type: actor
        owner: true
        inverse_name: conversions
        inverse_is_array: true
      - name: from_item
        type: item
        mandatory: true
        constant: true
      - name: to_item
        type: item
        mandatory: true
        constant: true

  - name: scope
    description: A flat grouping of actors, a swim lane of the graph
    extends: annotable
    is_root: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown

  - name: location
    description: A geographic place or site where actors operate
    extends: annotable
    is_root: true
    properties:
      - name: display_name
        type: localized_string
        min_length: 1
      - name: description
        type: localized_markdown
      - name: latitude
        type: latitude
      - name: longitude
        type: longitude
      - name: address
        type: string
      - name: postal_code
        type: string
      - name: city
        type: string
      - name: country_code
        type: country_code
      - name: un_locode
        type: un_locode
      - name: timezone
        type: string
